# Data Contract: Golden Customer 360 (as built)
# Generated by data_pipeline/data_contract.py from warehouse/c360.duckdb (table c360). Do not edit by hand.
# Format modelled on the organisers' DC-COLL-001 example. Differences from our Round 1 design are listed below.

id: C360-MAPLE-AS-BUILT
version: "0.1"
status: draft
generated_utc: "2026-10-04 15:13"
as_of_date: "2026-09-28"
grain: one row per customer_key
row_count: 1000729
owner:
  team: "CodeBlooded (Collections Data Product Team)"
  named_owner: "TBC: to be named by the bank on adoption"
  steward: "Data steward role: rules decide merges and blocks; a human reviews withheld links and low-trust identities"
consumers:
  - "Decisioning layer (identity gate, Decision Record)"
  - "Agent desktop / Customer 360 UI"
  - "Insight engine (analytics)"
  - "PTP-break model training and evaluation"
allowed_uses:
  - "Collections operations: agent context and next-best-action recommendations, always open to human review"
  - "Analytics and reporting on collections performance"
  - "Model training and evaluation for PTP-break prediction"
  - "Fairness and audit testing (protected attributes are held outside this table)"
not_allowed_uses:
  - "Marketing or cross-sell"
  - "Credit or underwriting decisions"
  - "Any decision driven by protected attributes, or by proxy-risk fields (city, fsa, preferred_language) without a logged disparity test"
  - "Disclosing PII outside role-based access"
  - "Contacting a customer whose identity_review_required is true before a human confirms who they are"
refresh:
  cadence: "Batch rebuild on demand in this build. Proposed production cadence: daily after source close (an assumption: the organisers specify none for the C360)."
  as_of_date: "2026-09-28"
  how: "python -m data_pipeline.identity && python -m data_pipeline.c360 (about 4 minutes on the full data)"
  freshness: "No streaming. Values are as of the snapshot date; identity links and trust scores can change whenever any source system is refreshed."

sources:
  - "customers"
  - "card_accounts"
  - "loan_accounts"
  - "deposit_accounts"
  - "external (bureau name/DOB for CIF matching only)"
  - "collections_cases"
  - "contact_history"
  - "promises_to_pay"
  - "agent_notes"
lineage: >
  raw CSV/Parquet (immutable) -> data_pipeline/load_raw.py -> warehouse/maple.duckdb raw_* (typed, IDs as text) -> data_pipeline/curate.py cur_* views (flags added, no rows dropped)
  -> data_pipeline/identity.py -> warehouse/c360.duckdb id_* tables (clusters, pair evidence, account links)
  -> data_pipeline/c360.py -> warehouse/c360.duckdb c360 + c360_attributes.
  Data issues and handling: docs/data_notes.md and outputs/DATA_QUALITY_REPORT.md. Identity accuracy: outputs/IDENTITY_METRICS.md.

fields:
  - name: customer_key
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching: crm_clusters.customer_key"
    meaning: "Stable key of the person = anchor CRM id of the cluster of duplicate CRM records. The CRM id is what notes, PTPs and contacts already carry."
    validation: "unique, not null"
  - name: anchor_crm_customer_id
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching: cluster anchor"
    meaning: "CRM record chosen as survivor (a record that is not a declared duplicate, then lowest id). Equals customer_key."
    validation: "not null; = customer_key"
  - name: member_crm_ids
    type: "VARCHAR[]"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching: crm_clusters"
    meaning: "All CRM ids merged into this customer_key (provenance of the merge; see table id_crm_pairs in warehouse/c360.duckdb for evidence)."
    validation: "contains anchor; length = n_crm_records"
  - name: n_crm_records
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching"
    meaning: "Number of CRM records in the cluster (1 or 2 in current data)."
    validation: ">= 1; <= 4"
  - name: first_name
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).first_name (anchor)"
    meaning: "Legal first name of the anchor record. Direct PII."
    validation: "trimmed"
  - name: last_name
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).last_name (anchor)"
    meaning: "Legal last name of the anchor record. Direct PII."
    validation: "trimmed"
  - name: date_of_birth
    type: "DATE"
    required: false
    null_rate_pct: 0.5
    source: "customers (CRM).date_of_birth (anchor)"
    meaning: "Date of birth (ISO). Direct PII."
    validation: "1900-01-01 <= value <= as_of_date; null allowed (0.5%)"
  - name: province_code
    type: "VARCHAR"
    required: false
    null_rate_pct: 0.2
    source: "customers (CRM).province_code_norm (anchor)"
    meaning: "Province/territory, normalised to 2-letter codes (rule C-CUST-02)."
    validation: "in {ON,QC,BC,AB,MB,SK,NS,NB,NL,PE,NT,YT,NU}"
  - name: city
    type: "VARCHAR"
    required: false
    null_rate_pct: 0.3
    source: "customers (CRM).city (anchor)"
    meaning: "Municipality. Quasi-identifier; proxy-risk field (requires disparity test per design contract)."
  - name: fsa
    type: "VARCHAR"
    required: false
    null_rate_pct: 1.0
    source: "customers (CRM).fsa (anchor)"
    meaning: "Forward Sortation Area (first 3 postal characters). Quasi-identifier; proxy-risk field."
    validation: "3 chars"
  - name: preferred_language
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).preferred_language (anchor)"
    meaning: "Preferred service language. Proxy-risk field per design contract; for contact routing only."
  - name: segment
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).segment (anchor)"
    meaning: "Customer segment (mass, emerging_affluent, affluent, private_hnw)."
  - name: customer_status
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).customer_status (anchor)"
    meaning: "CRM status (active, closed, closed_by_bank, deceased, written_off)."
  - name: customer_since_date
    type: "DATE"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).customer_since_date (anchor)"
    meaning: "First product opened with the bank."
    validation: "<= as_of_date"
  - name: tenure_months
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).tenure_months (anchor)"
    meaning: "Customer tenure in months as supplied by CRM."
    validation: ">= 0"
  - name: phone_last4
    type: "VARCHAR"
    required: false
    null_rate_pct: 1.5
    source: "customers (CRM).primary_phone_e164 (anchor), masked"
    meaning: "Last four digits of primary phone. Full numbers are not carried into the C360 (PII masked by default)."
    validation: "4 digits"
  - name: consent_sms
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).consent_sms"
    meaning: "Consent to SMS. AND across merged CRM records (conservative)."
    validation: "boolean"
  - name: consent_call
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).consent_call"
    meaning: "Consent to calls. AND across merged records."
    validation: "boolean"
  - name: consent_email
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).consent_email"
    meaning: "Consent to email. AND across merged records."
    validation: "boolean"
  - name: consent_autodialer
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).consent_autodialer"
    meaning: "Consent to autodialer. AND across merged records."
    validation: "boolean"
  - name: national_dncl_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).national_dncl_flag"
    meaning: "On the National DNCL (applies to telemarketing, not collections). OR across merged records."
    validation: "boolean"
  - name: internal_do_not_call_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).internal_do_not_call_flag"
    meaning: "Internal do-not-call. OR across merged records."
    validation: "boolean"
  - name: cease_communication_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).cease_communication_flag"
    meaning: "Customer asked to cease communication. OR across merged records."
    validation: "boolean; must stop contact"
  - name: bankruptcy_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).bankruptcy_flag"
    meaning: "Bankruptcy on record. OR across merged records."
    validation: "boolean"
  - name: consumer_proposal_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).consumer_proposal_flag"
    meaning: "Consumer proposal on record. OR across merged records."
    validation: "boolean"
  - name: deceased_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).deceased_flag"
    meaning: "Customer deceased. OR across merged records."
    validation: "boolean"
  - name: insolvency_filed_date
    type: "DATE"
    required: false
    null_rate_pct: 98.7
    source: "customers (CRM).insolvency_filed_date"
    meaning: "Earliest insolvency filing date among merged records."
    validation: "<= as_of_date"
  - name: credit_counselling_agency_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).credit_counselling_agency_flag"
    meaning: "Represented by a credit counselling agency. OR across merged records."
    validation: "boolean"
  - name: third_party_authorised_flag
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "customers (CRM).third_party_authorised_flag"
    meaning: "A third party is authorised to act. OR across merged records."
    validation: "boolean"
  - name: n_card_accounts
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "card_accounts via identity_links (linked only)"
    meaning: "Number of card accounts attributed to this customer (tier A-C, unique best customer)."
    validation: ">= 0"
  - name: n_card_active
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "card_accounts.account_status = 'active'"
    meaning: "Active card accounts among those linked."
    validation: "<= n_card_accounts"
  - name: card_balance_total
    type: "DOUBLE"
    required: false
    null_rate_pct: 46.3
    source: "sum(card_accounts.current_balance)"
    meaning: "Total card balance (CAD) of linked cards at their snapshot_date. Null if none."
    validation: "decimal(.,2)"
  - name: card_max_dpd
    type: "BIGINT"
    required: false
    null_rate_pct: 49.79
    source: "max(card_accounts.dpd)"
    meaning: "Worst days-past-due across linked cards. Null if none or dpd null."
    validation: ">= 0"
  - name: card_any_chargeoff
    type: "BOOLEAN"
    required: false
    null_rate_pct: 46.3
    source: "bool_or(card_accounts.chargeoff_flag)"
    meaning: "Any linked card charged off."
    validation: "boolean"
  - name: n_loan_accounts
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "loan_accounts via identity_links"
    meaning: "Number of loan accounts attributed."
    validation: ">= 0"
  - name: loan_principal_total
    type: "DOUBLE"
    required: false
    null_rate_pct: 67.13
    source: "sum(loan_accounts.principal_balance)"
    meaning: "Total principal balance (CAD) of linked loans. Null if none."
  - name: loan_max_dpd
    type: "BIGINT"
    required: false
    null_rate_pct: 69.31
    source: "max(loan_accounts.dpd)"
    meaning: "Worst days-past-due across linked loans."
    validation: ">= 0"
  - name: loan_any_chargeoff
    type: "BOOLEAN"
    required: false
    null_rate_pct: 67.13
    source: "bool_or(loan_accounts.chargeoff_flag)"
    meaning: "Any linked loan charged off."
    validation: "boolean"
  - name: n_deposit_accounts
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "deposit_accounts via identity_links"
    meaning: "Number of deposit accounts attributed."
    validation: ">= 0"
  - name: n_deposit_active
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "deposit_accounts.account_status = 'active'"
    meaning: "Active deposit accounts among those linked."
    validation: "<= n_deposit_accounts"
  - name: deposit_balance_total
    type: "DOUBLE"
    required: false
    null_rate_pct: 42.41
    source: "sum(deposit_accounts.current_balance)"
    meaning: "Total deposit balance (CAD); may be negative (overdrafts)."
  - name: overdraft_max_dpd
    type: "BIGINT"
    required: false
    null_rate_pct: 99.25
    source: "max(deposit_accounts.overdraft_dpd)"
    meaning: "Worst overdraft days-past-due; null for almost everyone."
    validation: ">= 0"
  - name: n_accounts_pending_review
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "identity_links.link_status in (review, ambiguous)"
    meaning: "Accounts whose best candidate is this customer but whose link is too weak/ambiguous to attribute. Their balances are NOT included above."
    validation: ">= 0"
  - name: n_cases_total
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "collections_cases via coll_customer_ref -> customer_key"
    meaning: "All collections cases ever (orphan CRM refs excluded)."
    validation: ">= 0"
  - name: case_promises_total
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "sum(collections_cases.promises_total)"
    meaning: "Promises recorded across all cases."
    validation: ">= 0"
  - name: case_promises_kept
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "sum(collections_cases.promises_kept)"
    meaning: "Promises kept across all cases."
    validation: ">= 0"
  - name: case_promises_broken
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "sum(collections_cases.promises_broken)"
    meaning: "Promises broken across all cases."
    validation: ">= 0"
  - name: first_case_open_date
    type: "DATE"
    required: false
    null_rate_pct: 72.22
    source: "min(collections_cases.case_open_date)"
    meaning: "Date the customer's earliest collections case was opened."
    validation: "<= as_of_date"
  - name: latest_case_open_date
    type: "DATE"
    required: false
    null_rate_pct: 72.22
    source: "max(collections_cases.case_open_date)"
    meaning: "Date the customer's most recent collections case was opened."
    validation: "<= as_of_date"
  - name: n_active_cases
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "collections_cases where outcome IS NULL"
    meaning: "Active cases. 'Active' = outcome is null, as defined in the dataset README example query."
    validation: ">= 0"
  - name: max_current_dpd
    type: "BIGINT"
    required: false
    null_rate_pct: 90.67
    source: "max(collections_cases.current_dpd) over active cases"
    meaning: "Worst current DPD."
    validation: ">= 0"
  - name: total_overdue
    type: "DOUBLE"
    required: false
    null_rate_pct: 90.67
    source: "sum(collections_cases.total_overdue) over active cases"
    meaning: "Overdue amount (CAD)."
  - name: total_exposure
    type: "DOUBLE"
    required: false
    null_rate_pct: 90.67
    source: "sum(collections_cases.total_exposure) over active cases"
    meaning: "Exposure (CAD)."
  - name: worst_bucket
    type: "VARCHAR"
    required: false
    null_rate_pct: 90.67
    source: "collections_cases.current_bucket of the max-DPD active case"
    meaning: "Delinquency bucket: current,1-30,31-60,61-90,91-120,121-150,151-180,180+."
  - name: hardship_flag
    type: "BOOLEAN"
    required: false
    null_rate_pct: 90.67
    source: "bool_or(collections_cases.hardship_flag) over active cases"
    meaning: "Hardship indicated on an active case. Route-only: may soften treatment, never intensify (design contract)."
    validation: "boolean"
  - name: hardship_program_accepted
    type: "BOOLEAN"
    required: false
    null_rate_pct: 90.67
    source: "bool_or(collections_cases.hardship_program_accepted)"
    meaning: "A hardship programme was accepted on an active case."
    validation: "boolean"
  - name: case_cease_contact_flag
    type: "BOOLEAN"
    required: false
    null_rate_pct: 90.67
    source: "bool_or(collections_cases.cease_contact_flag)"
    meaning: "Cease-contact flag on an active case."
    validation: "boolean; must stop contact"
  - name: insolvency_hold_flag
    type: "BOOLEAN"
    required: false
    null_rate_pct: 90.67
    source: "bool_or(collections_cases.insolvency_hold_flag)"
    meaning: "Insolvency hold on an active case."
    validation: "boolean"
  - name: deceased_hold_flag
    type: "BOOLEAN"
    required: false
    null_rate_pct: 90.67
    source: "bool_or(collections_cases.deceased_hold_flag)"
    meaning: "Deceased hold on an active case."
    validation: "boolean"
  - name: case_chargeoff_flag
    type: "BOOLEAN"
    required: false
    null_rate_pct: 90.67
    source: "bool_or(collections_cases.chargeoff_flag)"
    meaning: "Charge-off on an active case."
    validation: "boolean"
  - name: contacts_last_7d
    type: "BIGINT"
    required: false
    null_rate_pct: 90.67
    source: "max(collections_cases.contacts_last_7d)"
    meaning: "Contacts in the last 7 days as maintained by the collections platform."
    validation: ">= 0"
  - name: contact_cap_7d
    type: "BIGINT"
    required: false
    null_rate_pct: 90.67
    source: "min(collections_cases.contact_cap_7d)"
    meaning: "Contact cap per 7 days (most restrictive across active cases)."
    validation: ">= 0"
  - name: last_contact_ts_case
    type: "TIMESTAMP"
    required: false
    null_rate_pct: 91.47
    source: "max(collections_cases.last_contact_ts)"
    meaning: "Last contact timestamp per collections platform (local time)."
  - name: case_id_latest
    type: "VARCHAR"
    required: false
    null_rate_pct: 90.67
    source: "latest active case by case_open_date"
    meaning: "Most recently opened active case."
  - name: current_treatment
    type: "VARCHAR"
    required: false
    null_rate_pct: 90.67
    source: "collections_cases.current_treatment of latest active case"
    meaning: "Current treatment stage."
  - name: queue
    type: "VARCHAR"
    required: false
    null_rate_pct: 90.67
    source: "collections_cases.queue of latest active case"
    meaning: "Work queue."
  - name: current_ptp_id
    type: "VARCHAR"
    required: false
    null_rate_pct: 96.79
    source: "collections_cases.current_ptp_id of latest active case"
    meaning: "Current open PTP id."
    validation: "exists in promises_to_pay (verified, 0 orphans)"
  - name: current_ptp_amount
    type: "DOUBLE"
    required: false
    null_rate_pct: 96.79
    source: "collections_cases.current_ptp_amount"
    meaning: "Promised amount (CAD)."
    validation: "> 0 when present"
  - name: current_ptp_due_date
    type: "DATE"
    required: false
    null_rate_pct: 96.79
    source: "collections_cases.current_ptp_due_date"
    meaning: "Promised payment date."
  - name: n_contacts_total
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "contact_history via crm_customer_id -> customer_key"
    meaning: "All contact_history rows incl. internal system events. Orphan CRM refs excluded."
    validation: ">= 0"
  - name: n_contacts_90d
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "contact_history, direction <> 'internal', last 90 days to as_of_date"
    meaning: "Customer-facing contacts in 90 days (inbound + outbound)."
    validation: ">= 0"
  - name: n_rpc_90d
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "contact_history.rpc_flag"
    meaning: "Right-party contacts in 90 days."
    validation: ">= 0"
  - name: n_outbound_7d
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "contact_history.direction = 'outbound'"
    meaning: "Outbound contacts in last 7 days from the contact log (compare contacts_last_7d)."
    validation: ">= 0"
  - name: last_contact_ts_utc
    type: "TIMESTAMP"
    required: false
    null_rate_pct: 73.71
    source: "contact_history.contact_ts_utc"
    meaning: "Latest customer-facing contact (UTC)."
  - name: last_contact_channel
    type: "VARCHAR"
    required: false
    null_rate_pct: 73.71
    source: "contact_history.channel_effective"
    meaning: "Channel of the latest contact; channel_effective = COALESCE(channel_v2, channel) per REL-0926."
  - name: n_notes
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "agent_notes via crm_customer_id"
    meaning: "Number of agent notes."
    validation: ">= 0"
  - name: last_note_ts_utc
    type: "TIMESTAMP"
    required: false
    null_rate_pct: 80.58
    source: "max(agent_notes.note_ts_utc)"
    meaning: "Timestamp of the most recent agent note on any of the customer's CRM records."
  - name: n_ptp_total
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "promises_to_pay via crm_customer_id"
    meaning: "All PTPs."
    validation: ">= 0"
  - name: n_ptp_kept
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "promises_to_pay.ptp_status = 'kept'"
    meaning: "Number of the customer's promises to pay that were kept in full."
    validation: ">= 0"
  - name: n_ptp_broken
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "promises_to_pay.ptp_status = 'broken'"
    meaning: "Number of the customer's promises to pay that were broken (nothing received by the due date plus grace)."
    validation: ">= 0"
  - name: n_ptp_partially_kept
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "promises_to_pay.ptp_status = 'partially_kept'"
    meaning: "Number of the customer's promises to pay where only part of the amount was received."
    validation: ">= 0"
  - name: n_ptp_open
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "promises_to_pay.ptp_status = 'open'"
    meaning: "Number of the customer's promises to pay that are still open (outcome not yet known at the snapshot date)."
    validation: ">= 0"
  - name: last_ptp_status
    type: "VARCHAR"
    required: false
    null_rate_pct: 84.83
    source: "promises_to_pay.ptp_status of latest ptp_created_ts"
    meaning: "Status of the customer's most recently created promise to pay."
  - name: last_ptp_created_ts
    type: "TIMESTAMP"
    required: false
    null_rate_pct: 84.83
    source: "max(promises_to_pay.ptp_created_ts)"
    meaning: "Timestamp when the customer's most recent promise to pay was created."
  - name: identity_basis
    type: "VARCHAR"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching"
    meaning: "'crm_only' = no account could be attributed; 'crm+linked_accounts' = at least one tier A-C link."
    validation: "in {crm_only, crm+linked_accounts}"
  - name: match_confidence
    type: "DECIMAL(3,2)"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching tiers"
    meaning: "Minimum of cluster-merge confidence and linked-account tier confidences (A .97, B .90, C .88; merges .99/.95/.93); 1.0 when CRM-only singleton. Ordinal, not a calibrated probability."
    validation: "0 <= x <= 1"
  - name: n_linked_accounts
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "identity_links"
    meaning: "Accounts attributed through tier A-C links."
    validation: ">= 0"
  - name: shared_mobile_blocked
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching: crm_phone_sharing / link flag"
    meaning: "A phone of this customer is also used by a different person; phone evidence was neutralised and trust reduced."
    validation: "boolean"
  - name: conflict_flags
    type: "VARCHAR[]"
    required: true
    null_rate_pct: 0.0
    source: "identity_matching"
    meaning: "Distinct conflict types: phone_mismatch, postal_mismatch, first_name_conflict, multiple_candidate_people, crm_conflicting_identity_evidence, crm_possible_duplicate_unresolved, accounts_pending_identity_review."
    validation: "subset of known values"
  - name: open_conflicts
    type: "BIGINT"
    required: true
    null_rate_pct: 0.0
    source: "len(conflict_flags)"
    meaning: "Count of distinct conflict types."
    validation: ">= 0"
  - name: trust_score
    type: "DECIMAL(24,2)"
    required: true
    null_rate_pct: 0.0
    source: "data_pipeline/c360.py"
    meaning: "match_confidence - min(0.05*open_conflicts, 0.25) - 0.30*shared_mobile_blocked, clamped [0,1]. NOT a credit score; identity-data trust only."
    validation: "0 <= x <= 1, not null"
  - name: as_of_date
    type: "DATE"
    required: true
    null_rate_pct: 0.0
    source: "dataset README snapshot date"
    meaning: "Date the C360 is as-of (2026-09-28)."
    validation: "constant"
  - name: identity_review_required
    type: "BOOLEAN"
    required: true
    null_rate_pct: 0.0
    source: "trust_score < 0.70"
    meaning: "Identity review threshold 0.70 (assumption); below it a human confirms identity before action."
    validation: "boolean"

companion_tables:
  c360_attributes:
    grain: customer_key x field x source x value
    purpose: conflict-preserving provenance for postal_fsa and phone_last4 across CRM/CARDS/LENDING/CORE; conflict_status = 'conflict' when sources disagree. Disagreeing values are never overwritten.
    columns: [customer_key, field, value, source, confidence, conflict_status]
  id_identity_links (warehouse/c360.duckdb):
    grain: source account
    columns: [source_system, account_id, src_customer_ref, customer_key, link_status, tier, match_confidence, match_method, match_evidence, supporting_identity_records, bureau_supported, candidate_people, shared_mobile, conflict_flags]
  id_crm_pairs (warehouse/c360.duckdb):
    grain: candidate duplicate CRM pair
    columns: [id_a, id_b, blocks, same_nh, diff_nh, same_dob, diff_dob, same_ln, same_fn, same_postal, same_phone, declared, decision, method, confidence]

quality_rules:
  - {id: QR-01, severity: error, description: "customer_key unique and not null"}
  - {id: QR-02, severity: error, description: "trust_score in [0,1] and not null"}
  - {id: QR-03, severity: error, description: "no protected attribute column in c360"}
  - {id: QR-04, severity: error, description: "every source account has exactly one identity_links row (asserted in data_pipeline/identity.py)"}
  - {id: QR-05, severity: error, description: "auto-linked accounts only for tiers A-C with a unique best customer; D/E and ties are withheld for review"}
  - {id: QR-06, severity: warn, description: "orphan customer references are retained, never silently dropped or fixed"}
  - {id: QR-07, severity: error, description: "identity precision of auto-links >= 99% on accounts the collections system itself linked to a customer (measured 99.84%; tests/test_c360_api.py)"}

protected_and_pii_handling:
  excluded_protected: [gender_code, marital_status, citizenship_status, household_size, newcomer_program_flag, accessibility_needs_flag, vulnerability_type, accent]
  excluded_pending_decision: [vulnerability_flag]   # see differences_from_design_contract #3
  excluded_direct_pii: [email, street address, postal_code, full phone numbers, national_id_hash, middle/preferred name]
  retained_pii_note: first_name, last_name, date_of_birth are retained for the agent desktop; restrict access (RBAC) before any sharing.
  proxy_risk_fields_present: [city, fsa, preferred_language]   # require a logged disparity test before use in decisions

differences_from_design_contract:
  - id: 1
    topic: scope
    detail: >
      The Round 1 design lists PTP lifecycle, promise_quality, hardship_status (none/possible/confirmed), break_risk_t3/t1 and model_version.
      These are produced at runtime by the decisioning layer (features, model, gates), not by the dataset, so they are absent here.
      This table is the golden identity/account/delinquency/contact/PTP-history input.
  - id: 2
    topic: customer_key
    detail: >
      customer_key is the anchor CRM id of the duplicate cluster (no new surrogate), because notes, PTPs and contacts already carry CRM ids.
  - id: 3
    topic: vulnerability_flag
    detail: >
      The dataset README says vulnerability fields must not feed decisions. It is excluded from the C360; the decisioning layer uses it
      only as a protective gate and audit attribute, never as a model feature.
  - id: 4
    topic: hardship_status
    detail: >
      Only a boolean hardship_flag from collections_cases is available; possible/recorded/confirmed is derived in the decisioning layer.
  - id: 5
    topic: freshness
    detail: >
      Snapshot as of 2026-09-28; the C360 is a batch build, not streaming. Refresh by re-running data_pipeline.identity then data_pipeline.c360.
